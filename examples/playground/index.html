<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hitalk 交互示例，留下一点想法，开启一次交流。"
    />
    <meta name="theme-color" content="#f5f8f5" />
    <title>留言小院 · Hitalk</title>
    <link rel="stylesheet" href="/playground.css" />
    <script>
      try {
        if (localStorage.getItem('hitalk-playground-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <script type="module" src="/main.ts"></script>
  </head>
  <body class="playground">
    <a class="skip-link" href="#comment">跳到留言区</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Hitalk 首页">
        <svg
          class="brand-mark"
          width="29"
          height="29"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7 5h18a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H14l-7 5v-5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
            fill="currentColor"
          />
          <path
            d="M11 11v7m10-7v7m-10-3.5h10"
            stroke="var(--page-surface)"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
        <span>Hitalk<span class="brand-dot">.</span></span>
      </a>
      <nav class="header-actions" aria-label="页面导航">
        <a
          class="source-link"
          href="https://github.com/DreamStacks/hitalk-next"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="切换到深色模式"
          aria-pressed="false"
        >
          <svg
            class="moon-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"
              stroke-linejoin="round"
            />
          </svg>
          <svg
            class="sun-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </nav>
    </header>

    <section class="hello-banner" aria-labelledby="page-title">
      <div class="hello-art" aria-hidden="true">
        <svg
          class="hello-trails"
          viewBox="0 0 1440 320"
          preserveAspectRatio="none"
          fill="none"
        >
          <path
            class="hello-trail-back"
            d="M-80 240C130 90 260 90 440 180S780 340 1030 150 1330 90 1520 130"
          />
          <path
            class="hello-trail-front"
            pathLength="1"
            d="M-80 255C200 335 250 30 465 95S765 275 1000 160 1320 5 1520 100"
          />
        </svg>
        <span class="hello-bubble hello-bubble-hi">hi<span>!</span></span>
        <span class="hello-bubble hello-bubble-heart">♡</span>
        <span class="hello-bubble hello-bubble-dots"
          ><i></i><i></i><i></i
        ></span>
        <span class="hello-bubble hello-bubble-smile">
          <svg
            width="44"
            height="44"
            viewBox="0 0 40 40"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M12 13v3m16-3v3M11 23q9 10 18 0" />
          </svg>
        </span>
        <svg
          class="hello-plane"
          width="46"
          height="46"
          viewBox="0 0 48 48"
          fill="none"
        >
          <path
            d="M42 6 28 42l-8-14L6 20 42 6Z"
            fill="var(--page-surface)"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
          <path
            d="m42 6-22 22 8 14"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
        <span class="hello-dot hello-dot-one"></span
        ><span class="hello-dot hello-dot-two"></span>
        <span class="hello-spark">✳</span>
      </div>
      <div class="hello-copy">
        <span class="greeting-stamp" aria-hidden="true">(｡･ω･｡)ﾉ hi~</span>
        <h1 id="page-title">你好，来聊聊<span>。</span></h1>
        <p>来都来了，留个爪印吧。</p>
      </div>
      <label class="motion-toggle" title="暂停 / 继续背景动画">
        <input type="checkbox" aria-label="暂停背景动画" />
        <svg
          class="motion-pause"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="currentColor"
          aria-hidden="true"
        >
          <rect x="4" y="3" width="2" height="10" rx="1" />
          <rect x="10" y="3" width="2" height="10" rx="1" />
        </svg>
        <svg
          class="motion-play"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="m5 3 8 5-8 5Z" />
        </svg>
      </label>
    </section>

    <main class="page-main">
      <section class="conversation" aria-labelledby="conversation-title">
        <div class="conversation-heading">
          <h2 id="conversation-title">
            写一条留言<span class="heading-heart" aria-hidden="true">♡</span>
          </h2>
          <span class="format-hint"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="1.5"
                y="4"
                width="17"
                height="12"
                rx="2"
                stroke="currentColor"
              />
              <path
                d="M4.5 12.5v-5l2 2 2-2v5m5-5v5m-2-2 2 2 2-2"
                stroke="currentColor"
                stroke-linejoin="round"
              /></svg
            >支持 Markdown</span
          >
        </div>
        <div id="comment"></div>
        <p class="conversation-note">
          小小留言，也会被认真看见。<span>请把温柔也一起留下吧。</span>
        </p>
      </section>

      <aside class="example-note" aria-label="示例说明">
        <span class="example-dot" aria-hidden="true"></span>
        <p>这是 Hitalk 的交互示例。试试留言、回复，或送出一颗小红心。</p>
      </aside>
    </main>

    <footer class="site-footer">
      <span
        >Hitalk · 开源评论系统<span class="hitalk-secret" data-hitalk-secret
          ><button
            type="button"
            aria-label="叫小猫出来"
            title="叫小猫出来"
          ></button></span
      ></span>
      <a
        href="https://github.com/DreamStacks/hitalk-next"
        target="_blank"
        rel="noopener noreferrer"
        >Made with Hitalk <span aria-hidden="true">↗</span></a
      >
    </footer>
  </body>
</html>
