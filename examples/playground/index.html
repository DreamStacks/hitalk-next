<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hitalk 交互示例，留下一点想法，开启一次交流。"
    />
    <meta name="theme-color" content="#f5f8f5" />
    <title>留言小院 · Hitalk</title>
    <script>
      try {
        if (localStorage.getItem('hitalk-playground-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <script type="module" src="/main.ts"></script>
  </head>
  <body class="playground">
    <a class="skip-link" href="#comment">跳到留言区</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Hitalk 首页">
        <svg
          class="brand-mark"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7 5h18a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H14l-7 5v-5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
            fill="currentColor"
          />
          <path
            d="M11 11v7m10-7v7m-10-3.5h10"
            stroke="var(--page-surface)"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
        <span>Hitalk<span class="brand-dot">.</span></span>
      </a>
      <nav class="header-actions" aria-label="页面导航">
        <a
          class="source-link"
          href="https://github.com/ihoey/Hitalk"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="切换到深色模式"
          aria-pressed="false"
        >
          <svg
            class="moon-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"
              stroke-linejoin="round"
            />
          </svg>
          <svg
            class="sun-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main class="page-main">
      <section class="introduction" aria-labelledby="page-title">
        <span class="page-label"
          ><span aria-hidden="true">✳</span> 留言小院</span
        >
        <h1 id="page-title">留下一点想法<span class="title-dot">。</span></h1>
        <p>
          今天有什么新发现？<br class="mobile-break" />
          写下来，一起聊聊。
        </p>
      </section>

      <section class="conversation" aria-labelledby="conversation-title">
        <div class="conversation-heading">
          <h2 id="conversation-title">写一条留言</h2>
          <span class="format-hint"
            ><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect
                x="1.5"
                y="4"
                width="17"
                height="12"
                rx="2"
                stroke="currentColor"
              />
              <path
                d="M4.5 12.5v-5l2 2 2-2v5m5-5v5m-2-2 2 2 2-2"
                stroke="currentColor"
                stroke-linejoin="round"
              /></svg
            >支持 Markdown</span
          >
        </div>
        <div id="comment"></div>
        <p class="conversation-note">
          认真表达，友善交流。<span>每一份想法都值得被听见。</span>
        </p>
      </section>

      <aside class="example-note" aria-label="示例说明">
        <span class="example-dot" aria-hidden="true"></span>
        <p>这是 Hitalk 的交互示例。试试留言、回复，或送出一颗小红心。</p>
      </aside>
    </main>

    <footer class="site-footer">
      <span>Hitalk · 开源评论系统</span>
      <a
        href="https://github.com/ihoey/Hitalk"
        target="_blank"
        rel="noopener noreferrer"
        >Made with Hitalk <span aria-hidden="true">↗</span></a
      >
    </footer>
  </body>
</html>
